name: Test content mismatch detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake local ZIP with different content than the real WordPress.org ZIP.
      # IMPORTANT: Use a filename different from "${PLUGIN}.zip" (= "hello-dolly.zip")
      # because the action downloads the remote ZIP to "${PLUGIN}.zip". If we used the
      # same filename, the action would overwrite our fake ZIP before comparing.
      - name: Create a fake local ZIP with different content
        run: |
          mkdir -p fake-plugin/hello-dolly
          echo "This is fake content that does not match the real plugin" > fake-plugin/hello-dolly/hello.php
          cd fake-plugin
          zip -r ../fake-local.zip hello-dolly/
          cd ..
          echo "Created fake-local.zip"
          ls -lh fake-local.zip

      - name: Run action expecting failure due to content mismatch
        id: action
        uses: .
        continue-on-error: true
        with:
          zip-path: fake-local.zip
          plugin: hello-dolly
          version: "1.7.2"
          zip-url: "https://downloads.wordpress.org/plugin/%plugin%.%version%.zip"
          dry-run: "true"
          timeout: 2

      - name: Assert action failed due to content mismatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to content mismatch but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when ZIP contents do not match"
