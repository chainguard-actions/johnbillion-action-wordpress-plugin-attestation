name: Test custom zip-url template substitution
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake plugin zip and mock curl
        run: |
          # Create a simple directory structure to zip
          mkdir -p /tmp/hello-dolly
          echo "<?php // Hello Dolly plugin" > /tmp/hello-dolly/hello-dolly.php
          echo "=== Hello Dolly ===" > /tmp/hello-dolly/readme.txt

          # Create the "generated" zip (what the CI build produced)
          cd /tmp
          zip -qr hello-dolly-generated.zip hello-dolly/

          # Create the "deployed" zip with identical contents
          zip -qr hello-dolly-deployed.zip hello-dolly/

          # Install the fake curl that serves the deployed zip
          mkdir -p /tmp/fake-bin
          printf '%s\n' '#!/bin/sh' \
            '# Fake curl: serve the deployed zip, honoring both pipe and -o FILE forms.' \
            '# HEAD requests (used to check HTTP status) always return 200.' \
            'is_head=0' \
            'out=""' \
            'prev=""' \
            'for arg in "$@"; do' \
            '  if [ "$arg" = "--head" ]; then' \
            '    is_head=1' \
            '  fi' \
            '  case "$prev" in' \
            '    -o|--output) out="$arg" ;;' \
            '  esac' \
            '  prev="$arg"' \
            'done' \
            'if [ "$is_head" = "1" ]; then' \
            '  printf "200"' \
            '  exit 0' \
            'fi' \
            'if [ -n "$out" ] && [ "$out" != "/dev/null" ]; then' \
            '  cp /tmp/hello-dolly-deployed.zip "$out"' \
            'else' \
            '  cat /tmp/hello-dolly-deployed.zip' \
            'fi' \
            'exit 0' > /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl

          echo "Setup complete"

      - id: action
        uses: .
        env:
          PATH: /tmp/fake-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          zip-path: /tmp/hello-dolly-generated.zip
          plugin: hello-dolly
          version: "2.0.0"
          dry-run: "true"
          zip-url: "https://example-cdn.example.com/plugins/%plugin%.%version%.zip"

      - name: Assert zip-url output has correct substitution
        env:
          ACTUAL: ${{ steps.action.outputs.zip-url }}
        run: |
          echo "actual zip-url: $ACTUAL"
          EXPECTED="https://example-cdn.example.com/plugins/hello-dolly.2.0.0.zip"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: zip-url template substitution is correct"
