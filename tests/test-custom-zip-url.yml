name: Test custom zip-url with placeholder substitution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test plugin zip and mock curl
        run: |
          # Create the plugin directory structure
          mkdir -p /tmp/plugin-src/cool-plugin
          echo "<?php // Plugin Name: Cool Plugin" > /tmp/plugin-src/cool-plugin/cool-plugin.php
          echo "readme" > /tmp/plugin-src/cool-plugin/readme.txt

          # Create the zip (same zip used for both "generated" and "deployed")
          cd /tmp/plugin-src
          zip -r cool-plugin.2.3.4.zip cool-plugin/

          # Copy to workspace so zip-path can reference it
          cp /tmp/plugin-src/cool-plugin.2.3.4.zip "$GITHUB_WORKSPACE/cool-plugin.2.3.4.zip"

          # Also place the zip where the mock curl will serve it
          cp /tmp/plugin-src/cool-plugin.2.3.4.zip /tmp/served-plugin.zip

          # Create a mock curl using printf to avoid heredoc YAML issues
          mkdir -p /tmp/mock-bin
          printf '%s\n' \
            '#!/bin/sh' \
            'out=""' \
            'head_only=0' \
            'url=""' \
            'prev=""' \
            'for arg in "$@"; do' \
            '  case "$prev" in' \
            '    -o|--output) out="$arg" ;;' \
            '  esac' \
            '  case "$arg" in' \
            '    --head|-I) head_only=1 ;;' \
            '    http://*|https://*) url="$arg" ;;' \
            '  esac' \
            '  prev="$arg"' \
            'done' \
            'case "$url" in' \
            '  *cool-plugin*|*example-host*)' \
            '    if [ "$head_only" = "1" ]; then' \
            '      echo "200"' \
            '      exit 0' \
            '    else' \
            '      if [ -n "$out" ] && [ "$out" != "/dev/null" ]; then' \
            '        cp /tmp/served-plugin.zip "$out"' \
            '      else' \
            '        cat /tmp/served-plugin.zip' \
            '      fi' \
            '      exit 0' \
            '    fi' \
            '    ;;' \
            '  *)' \
            '    exec /usr/bin/curl "$@"' \
            '    ;;' \
            'esac' \
            > /tmp/mock-bin/curl
          chmod +x /tmp/mock-bin/curl

          # Prepend mock-bin to PATH for subsequent steps
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - name: Run action with custom zip-url template containing placeholders
        id: action
        uses: .
        with:
          zip-path: cool-plugin.2.3.4.zip
          plugin: cool-plugin
          version: "2.3.4"
          timeout: 1
          zip-url: "http://example-host/%plugin%.%version%.zip"
          dry-run: "true"

      - name: Assert zip-url output has placeholders substituted
        env:
          ACTUAL: ${{ steps.action.outputs.zip-url }}
        run: |
          echo "actual zip-url: $ACTUAL"
          EXPECTED="http://example-host/cool-plugin.2.3.4.zip"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected zip-url '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: zip-url placeholders correctly substituted"

      - name: Assert zip-sha-256 output is a valid SHA-256 hash
        env:
          ACTUAL: ${{ steps.action.outputs.zip-sha-256 }}
        run: |
          echo "actual zip-sha-256: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: zip-sha-256 output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qE '^[0-9a-f]{64}$'; then
            echo "FAIL: zip-sha-256 does not look like a valid SHA-256 hash: $ACTUAL"
            exit 1
          fi
          echo "PASS: zip-sha-256 is a valid SHA-256 hash"
