name: Test diff mismatch causes failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mismatched plugin zips and mock curl
        run: |
          # Create the "generated" zip (local build)
          mkdir -p /tmp/my-plugin-gen
          echo "<?php // Plugin file v1" > /tmp/my-plugin-gen/my-plugin.php
          echo "readme v1" > /tmp/my-plugin-gen/readme.txt
          cd /tmp
          zip -qr my-plugin-generated.zip my-plugin-gen/

          # Create the "deployed" zip with DIFFERENT contents
          mkdir -p /tmp/my-plugin-dep
          echo "<?php // Plugin file v2 DIFFERENT" > /tmp/my-plugin-dep/my-plugin.php
          echo "readme v2 DIFFERENT" > /tmp/my-plugin-dep/readme.txt
          zip -qr my-plugin-deployed.zip my-plugin-dep/

          # Install the fake curl that serves the deployed zip
          mkdir -p /tmp/fake-bin
          printf '%s\n' '#!/bin/sh' \
            '# Fake curl: serve the deployed zip, honoring both pipe and -o FILE forms.' \
            '# HEAD requests (used to check HTTP status) always return 200.' \
            'is_head=0' \
            'out=""' \
            'prev=""' \
            'for arg in "$@"; do' \
            '  if [ "$arg" = "--head" ]; then' \
            '    is_head=1' \
            '  fi' \
            '  case "$prev" in' \
            '    -o|--output) out="$arg" ;;' \
            '  esac' \
            '  prev="$arg"' \
            'done' \
            'if [ "$is_head" = "1" ]; then' \
            '  printf "200"' \
            '  exit 0' \
            'fi' \
            'if [ -n "$out" ] && [ "$out" != "/dev/null" ]; then' \
            '  cp /tmp/my-plugin-deployed.zip "$out"' \
            'else' \
            '  cat /tmp/my-plugin-deployed.zip' \
            'fi' \
            'exit 0' > /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl

          echo "Setup complete"

      - name: Run action (expect failure due to diff mismatch)
        id: action
        uses: .
        continue-on-error: true
        env:
          PATH: /tmp/fake-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          zip-path: /tmp/my-plugin-generated.zip
          plugin: my-plugin
          version: "1.0.0"
          dry-run: "true"
          zip-url: "https://downloads.wordpress.org/plugin/%plugin%.%version%.zip"

      - name: Assert action failed due to diff mismatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to zip content mismatch, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when zip contents differ"
