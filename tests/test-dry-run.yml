name: Test dry-run with zip-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/1.7.2
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Download the plugin zip ahead of time to use as the local zip-path.
      # The action will also download the same zip from wordpress.org and diff them.
      - name: Download hello-dolly zip to use as local zip-path
        run: |
          curl --silent --fail --output hello-dolly-local.zip \
            "https://downloads.wordpress.org/plugin/hello-dolly.1.7.2.zip"
          echo "Downloaded hello-dolly-local.zip"
          ls -lh hello-dolly-local.zip

      - id: action
        uses: .
        with:
          zip-path: hello-dolly-local.zip
          plugin: hello-dolly
          version: "1.7.2"
          dry-run: "true"

      - name: Assert zip-url output is set
        env:
          ACTUAL: ${{ steps.action.outputs.zip-url }}
        run: |
          echo "actual zip-url: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: zip-url output should not be empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert zip-sha-256 output is set
        env:
          ACTUAL: ${{ steps.action.outputs.zip-sha-256 }}
        run: |
          echo "actual zip-sha-256: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: zip-sha-256 output should not be empty"
            exit 1
          fi
          if [ ${#ACTUAL} -ne 64 ]; then
            echo "FAIL: zip-sha-256 should be 64 hex characters, got ${#ACTUAL}"
            exit 1
          fi
          echo "PASS"

      - name: Assert zip-url contains expected plugin and version
        env:
          ACTUAL: ${{ steps.action.outputs.zip-url }}
        run: |
          echo "actual zip-url: $ACTUAL"
          if [[ "$ACTUAL" != *"hello-dolly"* ]]; then
            echo "FAIL: zip-url should contain 'hello-dolly'"
            exit 1
          fi
          if [[ "$ACTUAL" != *"1.7.2"* ]]; then
            echo "FAIL: zip-url should contain '1.7.2'"
            exit 1
          fi
          echo "PASS"
