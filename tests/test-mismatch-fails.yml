name: Test mismatch between local and remote zip causes failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake zip that won't match the wordpress.org zip for hello-dolly.
      # IMPORTANT: use a filename different from hello-dolly.zip (which the action
      # will download the real zip to). If we used hello-dolly.zip, the action would
      # overwrite our fake zip with the real one, and the diff would pass incorrectly.
      - name: Create a fake local zip that does not match the remote
        run: |
          mkdir -p fake-plugin/hello-dolly
          echo "This is not the real plugin content" > fake-plugin/hello-dolly/hello.php
          cd fake-plugin
          zip -r ../hello-dolly-build.zip hello-dolly/
          cd ..
          echo "Created fake hello-dolly-build.zip:"
          ls -lh hello-dolly-build.zip

      - id: action
        uses: .
        continue-on-error: true
        with:
          zip-path: hello-dolly-build.zip
          plugin: hello-dolly
          version: "1.7.2"
          dry-run: "true"
          timeout: 5

      - name: Assert action failed due to zip mismatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when zips do not match"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed due to zip content mismatch"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
