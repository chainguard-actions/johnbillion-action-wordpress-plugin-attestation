name: Test zip unavailable hits timeout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build local zip and start empty server
        run: |
          set -e
          mkdir -p /tmp/serve-empty /tmp/build
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile('/tmp/build/missing-plugin.zip', 'w') as z:
              z.writestr('missing-plugin/missing-plugin.php', "<?php\n")
          EOF
          echo ok > /tmp/serve-empty/health.txt
          cd /tmp/serve-empty
          setsid nohup python3 -m http.server 8767 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8767/health.txt; then echo "server up"; exit 0; fi
            sleep 1
          done
          echo "server failed to start"; cat /tmp/http.log; exit 1
      - id: action
        uses: .
        continue-on-error: true
        with:
          zip-path: /tmp/build/missing-plugin.zip
          plugin: missing-plugin
          version: 9.9.9
          zip-url: 'http://127.0.0.1:8767/%plugin%.%version%.zip'
          timeout: 0
          dry-run: true
      - name: Assert action failed on timeout
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.zip-sha-256 }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when zip is unavailable"; exit 1
          fi
          if [ -n "$SHA" ]; then
            echo "FAIL: sha output should not be set when download failed"; exit 1
          fi
          echo "PASS"
